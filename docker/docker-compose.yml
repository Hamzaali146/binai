version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: cv_testing_backend
    ports:
      - "8000:8000"
    volumes:
      - cv_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/cv_testing.db
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: cv_testing_dashboard
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_BASE=http://backend:8000/api/v1
    restart: unless-stopped

volumes:
  cv_data:
    driver: local
