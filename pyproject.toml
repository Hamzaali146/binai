[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binai"
version = "1.0.0"
description = "Automated testing and evaluation framework for computer vision models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["computer-vision", "testing", "evaluation", "mlops", "metrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Full server + dashboard
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.22",
    "pandas>=2.2",
]
reports = [
    "reportlab>=4.0",
    "Jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
all = [
    "binai[server,dashboard,reports,dev]",
]

[project.scripts]
binai = "binai.cli:main"

[project.urls]
Homepage = "https://github.com/yourorg/binai"
Documentation = "https://github.com/yourorg/binai#readme"
Issues = "https://github.com/yourorg/binai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["binai*", "backend*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
