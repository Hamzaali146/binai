name: CV Testing Framework — CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint & Format ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff mypy
      - run: ruff check backend/ tests/
      - run: mypy backend/ --ignore-missing-imports --no-strict-optional || true

  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short \
            -p no:warnings

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── Model Evaluation Gate ──────────────────────────────────────────────────
  eval-gate:
    name: Model Evaluation Gate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1
          pip install -r requirements.txt

      - name: Start API server
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 8
          curl -f http://localhost:8000/health

      - name: Seed data and run evaluation
        run: python scripts/seed_data.py

      - name: Wait for evaluation to complete
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s http://localhost:8000/api/v1/evaluations/ | python3 -c "
          import sys, json
          evals = json.load(sys.stdin)
          if evals: print(evals[0]['status'])
          else: print('none')
          ")
            echo "Evaluation status: $STATUS"
            if [ "$STATUS" = "completed" ]; then exit 0; fi
            if [ "$STATUS" = "failed" ]; then exit 1; fi
            sleep 5
          done
          echo "Evaluation did not complete in time"
          exit 1

      - name: Assert minimum metric threshold
        run: |
          python3 - <<'EOF'
          import requests, sys
          evals = requests.get("http://localhost:8000/api/v1/evaluations/").json()
          completed = [e for e in evals if e["status"] == "completed"]
          if not completed:
              print("No completed evaluations found")
              sys.exit(1)
          ev = completed[0]
          metrics = ev.get("metrics") or {}
          accuracy = metrics.get("accuracy", 0)
          print(f"Accuracy: {accuracy:.4f}")
          # This uses a random predictor, so we just verify metrics were computed
          if accuracy is None:
              print("FAIL: No accuracy metric computed")
              sys.exit(1)
          print("PASS: Evaluation pipeline completed successfully")
          EOF

  # ── Docker Build ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t cv-testing-backend:ci .
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t cv-testing-dashboard:ci .
      - name: Smoke test backend container
        run: |
          docker run -d --name backend_test -p 8000:8000 cv-testing-backend:ci
          sleep 10
          curl -f http://localhost:8000/health
          docker stop backend_test
